springdoc:
  swagger-ui:
    enabled: false
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: false
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zcunsoft.clklog.api.controllers
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  application.name: clklog-api
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME}
      password: ${SPRING_SECURITY_USER_PASSWORD}
  datasource:
    clickhouse:
      jdbc-url: jdbc:clickhouse://localhost:8123/default
      username: default
      password:
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      connection-timeout: 20000
      socket-timeout: 60000
      maximum-pool-size: 5
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    lettuce:
      pool:
        min-idle: 4
        max-idle: 4
        max-active: 4
token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: 300
logging:
  file:
    path: log
clklog-common:
  access-control-allow-origin-patterns: "*"
clklog-api:
  project-name: clklogapp
  lib-type-map:
    all: all,全部
    android: Android,安卓
    ios: iOS,苹果
    js: js,网站
    miniprogram: MiniProgram,微信小程序
    harmonyos: HarmonyOS,鸿蒙
    dotnet: DotNET,DotNET
    cpp: cpp,cpp
    java: Java,Java
    python: Python,Python
