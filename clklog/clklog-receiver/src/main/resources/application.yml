server:
  port: 8080
logging:
  file:
    path: log
spring:
  application.name: clklog-receiver
  redis:
    # 单机配置
    host: ${redis_host}
    port: ${redis_port}
    database: 0
  #    sentinel:
  #      master: ${SPRING_REDIS_SENTINEL_MASTER:mymaster}
  #      nodes: ${SPRING_REDIS_SENTINEL_NODES}
  #      password: ${SPRING_REDIS_SENTINEL_PASSWORD:}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer: # 生产者
      client-id: "clklog-producer-group"
      retries: 3 # 设置大于 0 的值，则客户端会将发送失败的记录重新发送
      topic: clklog
      acks: 0
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        linger:
          ms: 1000
    listener:
      ack-mode: MANUAL_IMMEDIATE
  datasource:
    clickhouse:
      jdbc-url: jdbc:clickhouse://${clickhouse_host}:${clickhouse_port}/default
      username: ${clickhouse_user}
      password: ${clickhouse_pass}
receiver:
  thread-count: 2
  project-list: clklogapp
  resource-path:
  enable-simple-version: true
  access-control-allow-origin-patterns: "*"
  # 单个请求上报数据（压缩后/原始数据）的最大字节数限制（默认 2MB）
  max-request-size: 2097152
  enable-check-project-token: false
  # IP 地域缓存 Hash 的过期天数（默认 7 天，避免缓存长期堆积）
  client-ip-region-expire-days: 7

