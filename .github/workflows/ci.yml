name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'demo'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
      - 'demo'
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 14
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: zcunsoft/clklog-frontend
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          # TODO: Use Secrets when Public
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            HTML_DIR=dist
      - name: Login to Aliyun Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          # TODO: Use Secrets when Public
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Push image to Aliyun Docker Registry
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            --tag registry.cn-shanghai.aliyuncs.com/clklog/ui:${{ steps.meta.outputs.version }} \
            zcunsoft/clklog-frontend:${{ steps.meta.outputs.version }}
