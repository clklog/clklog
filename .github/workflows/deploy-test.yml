name: "AITEST (aitest 分支专属 · self-hosted 单 job 自洽：本地构建 6 项目 + Docker Compose 部署 + Smoke 5 条 + 离线固化用例 01-05)"

"on":
  push:
    branches: [aitest]
  workflow_dispatch:
    inputs:
      skip_local_build:
        description: "跳过本地 6 项目重新构建（前提：同一 Runner 工作目录上一次同 SHA run 已构建完 target/dist，仅快速回回归 compose+smoke）"
        required: false
        type: boolean
        default: false
      keep_aitest_up:
        description: "保留 AITEST 容器常驻运行（用于随时登录验证；关闭则 job 结束后自动清理）"
        required: false
        type: boolean
        default: false

concurrency:
  # 方案 Z' 单 job 自洽 2026-09-07：用 -v3 绕开 -v2 旧锁
  group: deploy-test-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "8"
  JAVA_DISTRO: "temurin"
  NODE_VERSION: "18"
  AITEST_BUMP: "2026-09-09T13:15:00+08:00"
  # Node24 未稳定前继续用 Node20
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read

jobs:
  deploy-test-aitest:
    name: aitest-build-deploy-smoke
    runs-on: [self-hosted, clklog-ce-runner]
    timeout-minutes: 200
    env:
      COMPOSE_PROJECT_NAME_PREFIX: "clklog-aitest"
    steps:
      - name: Pre-clean Runner workspace + aitest docker residues
        shell: bash
        run: |
          set -u
          set -o pipefail 2>/dev/null || true
          exec > >(tee /tmp/s0_preclean.log) 2>&1 || true
          echo "[preclean] start"

          KEEP_UP="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            KEEP_UP="true"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.keep_aitest_up }}" != "false" ]; then
              KEEP_UP="true"
            fi
          fi
          echo "KEEP_AITEST_UP=${KEEP_UP}" | tee -a "$GITHUB_ENV"
          echo "[preclean] KEEP_AITEST_UP=${KEEP_UP}"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # 使用新的版本化目录结构
          RUNTIME_ROOT="/mnt/data/testing/aitest/versions/${SHA}/${REPO_NAME}"
          TEST_RESULTS_DIR="/mnt/data/testing/aitest/versions/${SHA}/test-results"
          mkdir -p "${TEST_RESULTS_DIR}"
          echo "AITEST_RUNTIME_ROOT=${RUNTIME_ROOT}" | tee -a "$GITHUB_ENV"
          echo "AITEST_TEST_RESULTS_DIR=${TEST_RESULTS_DIR}" | tee -a "$GITHUB_ENV"
          mkdir -p "${RUNTIME_ROOT}" 2>/dev/null || true
          echo "[preclean] AITEST_RUNTIME_ROOT=${RUNTIME_ROOT}"

          AITEST_GATEWAY_PORT="80"
          if ss -ltn 2>/dev/null | awk '{print $4}' | grep -qE ":${AITEST_GATEWAY_PORT}$"; then
            if ! docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -qE 'clklog-aitest-.*80->80/tcp'; then
              echo "[FATAL] port ${AITEST_GATEWAY_PORT} is already in use (not by clklog-aitest)"
              ss -ltn 2>/dev/null | grep -E ":${AITEST_GATEWAY_PORT}(\\s|$)" || true
              exit 2
            fi
          fi
          echo "AITEST_GATEWAY_PORT=${AITEST_GATEWAY_PORT}" | tee -a "$GITHUB_ENV"
          echo "[preclean] AITEST_GATEWAY_PORT=${AITEST_GATEWAY_PORT}"

          if [ "${KEEP_UP}" != "true" ]; then
            IDS_FILE="$(mktemp)"
            NETS_FILE="$(mktemp)"
            VOLS_FILE="$(mktemp)"
            docker ps -a --format '{{.ID}} {{.Names}}' 2>/dev/null | awk '$2 ~ /^clklog-aitest-/ && $2 !~ /^clklog-aitest-live-/{print $1}' > "${IDS_FILE}" || true
            if [ -s "${IDS_FILE}" ]; then
              cat "${IDS_FILE}" | xargs -r docker rm -f || true
            fi
            docker network ls --format '{{.ID}} {{.Name}}' 2>/dev/null | awk '$2 ~ /^clklog-aitest-/ && $2 !~ /^clklog-aitest-live/{print $1}' > "${NETS_FILE}" || true
            if [ -s "${NETS_FILE}" ]; then
              cat "${NETS_FILE}" | xargs -r docker network rm || true
            fi
            docker volume ls --format '{{.Name}}' 2>/dev/null | awk '$1 ~ /^clklog-aitest-/ && $1 !~ /^clklog-aitest-live/{print $1}' > "${VOLS_FILE}" || true
            if [ -s "${VOLS_FILE}" ]; then
              cat "${VOLS_FILE}" | xargs -r docker volume rm || true
            fi

            WS="/mnt/data/github-runner/_work/${REPO_NAME}/${REPO_NAME}"
            if [ -d "${WS}" ]; then
              chmod -R a+rwx "${WS}/docker-compose/clklog_dc_data" 2>/dev/null || true
              rm -rf "${WS}/docker-compose/clklog_dc_data" 2>/dev/null || true
            fi
          fi
          echo "[preclean] done"

      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: 计算 sha_short + LOCAL_TAG + SKIP_LOCAL_BUILD + VER_*（统一 bash Step，彻底消除 job.env 表达式兼容性问题）
        id: compute_sha_and_env
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(pwd)

          DISPATCH_SKIP="${{ inputs.skip_local_build }}"
          if [ "${DISPATCH_SKIP}" = "true" ]; then
            SKIP_LOCAL_BUILD="true"
          else
            SKIP_LOCAL_BUILD="false"
          fi
          echo "SKIP_LOCAL_BUILD=${SKIP_LOCAL_BUILD}" | tee -a "$GITHUB_ENV"

          SHA7=$(git rev-parse HEAD | cut -c1-7)
          echo "SHA=${SHA7}" | tee -a "$GITHUB_ENV"
          TAG="local-aitest-${SHA7}"
          echo "LOCAL_TAG=${TAG}" | tee -a "$GITHUB_ENV"
          echo "[compute] SHA=${SHA7}  LOCAL_TAG=${TAG}  SKIP_LOCAL_BUILD=${SKIP_LOCAL_BUILD}"

          if [ "${KEEP_AITEST_UP:-false}" = "true" ]; then
            echo "AITEST_COMPOSE_PROJECT_NAME=clklog-aitest-live" | tee -a "$GITHUB_ENV"
          else
            echo "AITEST_COMPOSE_PROJECT_NAME=clklog-aitest-${SHA7}" | tee -a "$GITHUB_ENV"
          fi

          if [ "${SKIP_LOCAL_BUILD}" = "true" ]; then
            echo "[compute] SKIP_LOCAL_BUILD=true → VER_* 从本目录 pom.xml 取"
          else
            echo "[compute] VER_* 取本地 pom.xml（当前 job 构建完直接生效，无需等 job 间 outputs）"
          fi
          for sub in manage api receiver processing init; do
            if [ -f "${BASE}/clklog/clklog-${sub}/pom.xml" ]; then
              V=$(sed -n 's/.*<project[^>]*>.*<version>\([^<]*\)<\/version>.*/\1/p; T; q' "${BASE}/clklog/clklog-${sub}/pom.xml" 2>/dev/null || true)
              if [ -z "$V" ]; then
                V=$(awk 'BEGIN{p=0;ver=""} /<project[ >]/{p=1} p&&/<version>/&&ver==""{gsub(/.*<version>|<\/version>.*/,"");ver=$0;exit} END{print ver||"0.0.0-SNAPSHOT"}' "${BASE}/clklog/clklog-${sub}/pom.xml" 2>/dev/null)
              fi
              if [ -z "$V" ]; then V="0.0.0-SNAPSHOT"; fi
            else
              V="0.0.0-SNAPSHOT"
            fi
            VAR="VER_$(echo "$sub" | tr '[:lower:]' '[:upper:]')"
            echo "${VAR}=${V}" | tee -a "$GITHUB_ENV"
            declare "${VAR}=${V}"
          done
          echo "[compute] 最终 VER_*: MANAGE=${VER_MANAGE} API=${VER_API} RECEIVER=${VER_RECEIVER} PROCESSING=${VER_PROCESSING} INIT=${VER_INIT}"
          unset V VAR

      - name: Runner 环境信息（env 已在 compute_sha_and_env 注入）
        shell: bash
        run: |
          echo "Runner=$RUNNER_NAME  hostname=$(hostname)  os=$(uname -a)  user=$(whoami)"
          echo "SHA=${SHA}  LOCAL_TAG=${LOCAL_TAG}  SKIP_LOCAL_BUILD=${SKIP_LOCAL_BUILD}"
          echo "docker compose: $(docker compose version 2>/dev/null || echo 'not found')"
          echo "java:     $(command -v java && java -version 2>&1 | head -1 || echo 'not found (Step5 setup-java 会补)')"
          echo "mvn:      $(command -v mvn || echo 'not found (Step5 setup-java 自带 wrapper 或 mvnw 兜底)')"
          echo "node/npm: $(command -v node && node -v || echo 'not found (Step6 setup-node 会补)')"
          echo "pnpm:     $(command -v pnpm || echo 'not found (npm ci 走官方 registry)')"
          if command -v yq >/dev/null 2>&1; then
            echo "✅ yq 已安装：$(yq --version | head -1)"
          else
            echo "⚠️  未检测到 yq（docker compose >= v2.20 原生 include 已够用；compose flatten 段会自动降级 sed 手工兜底，不阻断）"
          fi

      # ==================================================
      # 构建阶段（self-hosted Runner 本地构建，无需跨 job artifact）
      #   - Java：共用 ~/.m2 cache，Maven 本地构建 target/*.jar
      #   - UI：cache node_modules，npm ci → npm run build → dist/
      # ==================================================
      - name: S5 Self-hosted 本地 JDK8/Maven/Node 兜底（apt 内网源安装，避免外网下载失败）
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "INFO: Wait for dpkg lock (max 10 min) in case background install is running..."
          LOCK_WAIT=0
          while [ "$LOCK_WAIT" -lt 120 ]; do
            if [ ! -f /var/lib/dpkg/lock-frontend ] || (command -v fuser >/dev/null 2>&1 && ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1); then
              break
            fi
            sleep 5
            LOCK_WAIT=$((LOCK_WAIT + 1))
          done
          echo "INFO: dpkg lock check done (waited ${LOCK_WAIT} loops)"

          NEED_UPDATE=0
          INSTALL_PKGS=""

          if command -v javac >/dev/null 2>&1 && command -v java >/dev/null 2>&1; then
            :
          else
            NEED_UPDATE=1
            INSTALL_PKGS="$INSTALL_PKGS openjdk-8-jdk"
          fi

          if command -v mvn >/dev/null 2>&1; then
            :
          else
            NEED_UPDATE=1
            INSTALL_PKGS="$INSTALL_PKGS maven"
          fi

          NODE_OK=0
          if command -v node >/dev/null 2>&1; then
            NODE_MAJOR=$(node -v 2>/dev/null | sed -n 's/^v\?\([0-9]*\).*/\1/p')
            if [ -n "$NODE_MAJOR" ] && [ "$NODE_MAJOR" -ge 18 ] 2>/dev/null; then
              if command -v npm >/dev/null 2>&1; then
                NODE_OK=1
              fi
            fi
          fi
          if [ "$NODE_OK" != "1" ]; then
            NEED_UPDATE=1
            INSTALL_PKGS="$INSTALL_PKGS nodejs npm"
          fi

          if [ "$NEED_UPDATE" = "1" ]; then
            INSTALL_PKGS="$(echo "$INSTALL_PKGS" | xargs)"
            echo "INFO: missing tools [$INSTALL_PKGS] -> install via intranet apt mirror mirrors.zcunsoft.com (retry up to 10 times on dpkg lock)"
            export DEBIAN_FRONTEND=noninteractive
            RETRY=0
            while [ "$RETRY" -lt 10 ]; do
              INSTALL_RC=0
              if command -v sudo >/dev/null 2>&1; then
                sudo -n apt-get update -y >/tmp/apt-update.log 2>&1 || echo "apt-update-warn: $(tail -5 /tmp/apt-update.log)"
                sudo -n apt-get install -y $INSTALL_PKGS >/tmp/apt-install.log 2>&1 || INSTALL_RC=$?
              else
                apt-get update -y >/tmp/apt-update.log 2>&1 || true
                apt-get install -y $INSTALL_PKGS >/tmp/apt-install.log 2>&1 || INSTALL_RC=$?
              fi
              if [ "$INSTALL_RC" -eq 0 ]; then
                tail -10 /tmp/apt-install.log || true
                break
              fi
              if grep -qiE "Could not get lock|dpkg frontend is locked|Unable to lock" /tmp/apt-install.log 2>/dev/null; then
                echo "WARN: dpkg locked (attempt $((RETRY+1))/10) - sleep 15s"
                sleep 15
                RETRY=$((RETRY + 1))
                continue
              fi
              echo "WARN: apt install failed rc=$INSTALL_RC (attempt $((RETRY+1))/10) - tail:"
              tail -20 /tmp/apt-install.log || true
              RETRY=$((RETRY + 1))
              sleep 10
            done
          else
            echo "OK: System JDK8 + Maven + Node+npm already present, skip apt install"
          fi

          JH=""
          if [ -d /usr/lib/jvm ]; then
            for d in /usr/lib/jvm/java-8-openjdk* /usr/lib/jvm/java-1.8.0-openjdk*; do
              if [ -d "$d" ] && [ -x "$d/bin/java" ]; then JH="$d"; break; fi
            done
          fi
          if [ -z "$JH" ] && command -v java >/dev/null 2>&1; then
            JLINK="$(command -v java)"
            while [ -L "$JLINK" ]; do JLINK="$(readlink -f "$JLINK")"; done
            JH="$(dirname "$(dirname "$JLINK")")"
          fi
          if [ -n "$JH" ]; then
            echo "JAVA_HOME=$JH" | tee -a "$GITHUB_ENV"
            echo "OK: JAVA_HOME=$JH"
            if [ -d "$JH/bin" ]; then
              echo "$JH/bin" >> "$GITHUB_PATH"
              echo "OK: Added $JH/bin to GITHUB_PATH"
            fi
          fi

          if command -v mvn >/dev/null 2>&1; then
            MLINK="$(command -v mvn)"
            while [ -L "$MLINK" ]; do MLINK="$(readlink -f "$MLINK")"; done
            MH="$(dirname "$(dirname "$MLINK")")"
            if [ -d "$MH/lib" ] || [ -f "$MH/bin/mvn" ]; then
              echo "MAVEN_HOME=$MH" | tee -a "$GITHUB_ENV"
              if [ -d "$MH/bin" ]; then
                echo "$MH/bin" >> "$GITHUB_PATH"
              fi
            fi
          fi

          if command -v javac >/dev/null 2>&1 && command -v java >/dev/null 2>&1 && command -v mvn >/dev/null 2>&1; then
            echo "SYSTEM_JDK_MVN_READY=true" | tee -a "$GITHUB_ENV"
            echo "OK: Local JDK8 + Maven ready -> skip setup-java action"
          fi
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            NM="$(node -v 2>/dev/null | sed -n 's/^v\?\([0-9]*\).*/\1/p')"
            if [ -n "$NM" ] && [ "$NM" -ge 18 ] 2>/dev/null; then
              echo "SYSTEM_NODE_READY=true" | tee -a "$GITHUB_ENV"
              echo "OK: Local Node $NM + npm ready -> skip setup-node action"
            fi
          fi

          echo "--- Maven settings.xml: use company intranet mirror mirrors.zcunsoft.com (NO_PROXY direct, proxy 403 for central) ---"
          mkdir -p ~/.m2
          (
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">'
            echo '  <mirrors>'
            echo '    <mirror>'
            echo '      <id>zcunsoft-maven-public</id>'
            echo '      <mirrorOf>*</mirrorOf>'
            echo '      <url>https://mirrors.zcunsoft.com/repository/maven-public/</url>'
            echo '      <blocked>false</blocked>'
            echo '    </mirror>'
            echo '  </mirrors>'
            echo '  <localRepository>'$HOME'/.m2/repository</localRepository>'
            echo '</settings>'
          ) > ~/.m2/settings.xml
          echo "OK: ~/.m2/settings.xml written with mirror https://mirrors.zcunsoft.com/repository/maven-public/ (mirrorOf=*)"

          echo "--- npm registry proxy / company mirror ---"
          NPM_REG=""
          if command -v npm >/dev/null 2>&1; then
            NPUB=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://mirrors.zcunsoft.com/repository/npm-group/" 2>/dev/null || echo "000")
            if [ "$NPUB" = "200" ]; then
              NPM_REG="https://mirrors.zcunsoft.com/repository/npm-group/"
            else
              NPUBC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://mirrors.zcunsoft.com/repository/npm-all/" 2>/dev/null || echo "000")
              if [ "$NPUBC" = "200" ]; then
                NPM_REG="https://mirrors.zcunsoft.com/repository/npm-all/"
              fi
            fi
            if [ -n "$NPM_REG" ]; then
              npm config set registry "$NPM_REG" 2>/dev/null || true
              echo "OK: npm registry set to $NPM_REG"
            else
              echo "WARN: No company npm mirror detected, use default (may fail to download packages)"
            fi
          fi

          echo "--- final toolchain versions ---"
          (command -v java && java -version 2>&1) || true
          (command -v javac && javac -version 2>&1) || true
          (command -v mvn && mvn -v 2>&1 | head -2) || true
          (command -v node && node -v 2>&1) || true
          (command -v npm && npm -v 2>&1) || true

      - name: Setup JDK 8 (Temurin · fallback，仅当本地 apt 兜底未就绪时触发)
        if: ${{ env.SYSTEM_JDK_MVN_READY != 'true' }}
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Cache Maven ~/.m2 repository（M2 跨 run 复用，避免每次整包重拉）
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-aitest-${{ hashFiles('clklog/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-mvn-aitest-
            ${{ runner.os }}-mvn-

      - name: Setup Node 18（fallback，仅当本地 apt 兜底未就绪时触发）
        if: ${{ env.SYSTEM_NODE_READY != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache clklog-ui node_modules（lockfile 未变时跳过 npm ci 全量安装）
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        uses: actions/cache@v4
        with:
          path: clklog/clklog-ui/node_modules
          key: ${{ runner.os }}-node18-ui-aitest-${{ hashFiles('clklog/clklog-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node18-ui-aitest-${{ hashFiles('clklog/clklog-ui/package.json') }}-
            ${{ runner.os }}-node18-ui-aitest-

      - name: "Build Java · init（首项 · 基础配置/公共模块依赖先编译进本地 M2，避免其他 4 项目报缺）"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-init
        shell: bash
        run: |
          set -euo pipefail
          chmod -x mvnw 2>/dev/null || true
          rm -f mvnw 2>/dev/null || true
          mvn -B -ntp clean install -DskipTests -DskipITs

      - name: "Build Java · manage"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-manage
        shell: bash
        run: |
          set -euo pipefail
          chmod -x mvnw 2>/dev/null || true
          rm -f mvnw 2>/dev/null || true
          mvn -B -ntp clean package -DskipTests -DskipITs
          ls -la target/*.jar 2>/dev/null || true

      - name: "Build Java · api"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-api
        shell: bash
        run: |
          set -euo pipefail
          chmod -x mvnw 2>/dev/null || true
          rm -f mvnw 2>/dev/null || true
          mvn -B -ntp clean package -DskipTests -DskipITs
          ls -la target/*.jar 2>/dev/null || true

      - name: "Build Java · receiver"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-receiver
        shell: bash
        run: |
          set -euo pipefail
          chmod -x mvnw 2>/dev/null || true
          rm -f mvnw 2>/dev/null || true
          mvn -B -ntp clean package -DskipTests -DskipITs
          ls -la target/*.jar 2>/dev/null || true

      - name: "Build Java · processing（jar-with-dependencies assembly 打包，耗时略长）"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-processing
        shell: bash
        run: |
          set -euo pipefail
          chmod -x mvnw 2>/dev/null || true
          rm -f mvnw mvnw.cmd 2>/dev/null || true
          rm -rf .mvn/wrapper/maven-wrapper.jar .mvn/wrapper/maven-wrapper.properties 2>/dev/null || true
          echo "--- which mvn: $(which mvn 2>&1) ---"
          mvn -version 2>&1 | head -3
          echo "--- settings.xml (mirror section) ---"
          grep -A 8 mirrors ~/.m2/settings.xml 2>/dev/null || echo "no settings.xml mirrors"
          set +o pipefail
          mvn -B -ntp -e clean package -DskipTests -DskipITs 2>&1 | tee /tmp/build_processing.log | tail -80
          MVN_RC=${PIPESTATUS[0]}
          set -o pipefail
          echo "MVN_RC=${MVN_RC}"
          echo "--- head 120 build_processing.log ---"
          head -120 /tmp/build_processing.log 2>/dev/null || true
          echo "--- target jars ---"
          ls -la target/*.jar 2>/dev/null || true
          exit "${MVN_RC}"

      - name: "Build Node UI · npm ci → test:unit（存在则跑 → passWithNoTests）→ build dist"
        if: ${{ env.SKIP_LOCAL_BUILD != 'true' }}
        working-directory: clklog/clklog-ui
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--openssl-legacy-provider"
          NPM_REG="https://mirrors.zcunsoft.com/repository/npm-central/"
          NPM_REG_OK=$(curl -sI --max-time 12 "${NPM_REG}lodash/latest" 2>/dev/null | head -1 | grep -c " 200 " || true)
          if [ "${NPM_REG_OK}" = "1" ]; then
            echo "✅ 内网npm镜像${NPM_REG}可用，设置registry+global .npmrc"
            npm config set registry "${NPM_REG}"
            echo "registry=${NPM_REG}" > ~/.npmrc
          else
            echo "⚠️  内网npm镜像不可用（HTTP!200），尝试系统默认registry.npmjs.org+代理"
          fi
          echo "--- npm config get registry: $(npm config get registry) ---"
          echo "--- pwd + ls package-lock / package.json ---"
          pwd
          ls -la package.json 2>/dev/null
          ls -la package-lock.json 2>/dev/null || echo "⚠️  无 package-lock.json"
          npm config get registry
          set +o pipefail
          LOG=/tmp/ui_build.log
          : > "$LOG"
          if [ -f package-lock.json ]; then
            echo "--- npm ci (lockfile 存在) ---"
            echo "--- 重写 package-lock.json resolved URL: npmmirror/npmjs → ${NPM_REG} ---"
            sed -i -E "s|https://registry\.npmmirror\.com/|${NPM_REG}|g" package-lock.json
            sed -i -E "s|https://registry\.npmjs\.org/|${NPM_REG}|g" package-lock.json
            echo "--- sed后抽样 resolved 字段 (前5条):"
            grep -o '"resolved": "[^"]*"' package-lock.json 2>/dev/null | head -5 || echo "⚠️  无resolved字段抽样"
            npm ci 2>&1 | tee "$LOG" | tail -60
            RC=${PIPESTATUS[0]}
          else
            echo "--- npm install (lockfile 不存在，install 兜底) ---"
            npm install --no-audit --no-fund --prefer-offline 2>&1 | tee "$LOG" | tail -60
            RC=${PIPESTATUS[0]}
          fi
          set -o pipefail
          echo "NPM_INSTALL_RC=${RC}"
          if [ "${RC}" != "0" ]; then
            echo "=== first 300 lines ui_build.log ==="; head -300 "$LOG" 2>/dev/null || true
            echo "=== last 300 lines ui_build.log ==="; tail -300 "$LOG" 2>/dev/null || true
            exit "${RC}"
          fi
          set +o pipefail
          npm run test:unit --if-present -- --ci --passWithNoTests 2>&1 | tee -a "$LOG" | tail -20 || true
          echo "--- npm run build ---"
          npm run build --if-present 2>&1 | tee -a "$LOG" | tail -60
          RC=${PIPESTATUS[0]}
          set -o pipefail
          echo "NPM_BUILD_RC=${RC}"
          if [ "${RC}" != "0" ]; then
            echo "=== last 400 lines ui_build.log ==="; tail -400 "$LOG" 2>/dev/null || true
            exit "${RC}"
          fi
          ls -la dist/index.html 2>/dev/null && echo "✅ UI dist 构建成功" || echo "⚠️  dist 未生成（稍后 compose 构建前会告警）"

      - name: 构建产物快照（SKIP_LOCAL_BUILD=true 时顺带验证是否真有 target/dist）
        shell: bash
        run: |
          set -e
          BASE=$(pwd)
          echo "--- jar snapshot（SKIP=$SKIP_LOCAL_BUILD）---"
          for sub in manage api receiver processing init; do
            dir="${BASE}/clklog/clklog-${sub}"
            found=$(ls "$dir/target/"*.jar 2>/dev/null | wc -l)
            echo "  clklog-${sub}: jars=$found"
            if [ "$found" -eq 0 ] && [ "${SKIP_LOCAL_BUILD}" = "true" ]; then
              echo "    ⚠️  SKIP_LOCAL_BUILD=true 但本项目无 jar，会在 compose build 阶段失败。如需跳过请先跑完整构建。"
            fi
          done
          echo "--- UI dist ---"
          if [ -d "${BASE}/clklog/clklog-ui/dist" ] && [ -f "${BASE}/clklog/clklog-ui/dist/index.html" ]; then
            echo "  clklog-ui: dist OK (index.html 存在)"
          else
            echo "  clklog-ui: dist 不存在（SKIP_LOCAL_BUILD=true 时将导致 compose ui stage COPY 失败）"
          fi

      - name: 修复 Java Dockerfile FROM openjdk:8（Docker Hub 已 2023 废弃 → Official Temurin 8 JDK）
        working-directory: clklog
        shell: bash
        run: |
          set -euo pipefail
          for sub in manage api receiver init processing; do
            f="clklog-${sub}/Dockerfile"
            if [ ! -f "$f" ]; then echo "  skip clklog-${sub}: no Dockerfile at ${f}"; continue; fi
            ORIG="$(head -1 "$f")"
            sed -i -E 's|^FROM openjdk:8[^ ]*|FROM eclipse-temurin:8u422-b05-jdk|' "$f"
            NEW="$(head -1 "$f")"
            echo "  clklog-${sub}: FROM [${ORIG}] → [${NEW}]"
          done
          echo "=== 替换后验证（5 个首行 grep）==="
          for sub in manage api receiver init processing; do
            f="clklog-${sub}/Dockerfile"
            [ -f "$f" ] && echo "  - $(head -1 "$f")  # ${f}" || true
          done
          EXPECT_TEMURIN=4
          ACTUAL_TEMURIN=$(grep -l 'eclipse-temurin:8u422-b05-jdk' clklog-manage/Dockerfile clklog-api/Dockerfile clklog-receiver/Dockerfile clklog-init/Dockerfile clklog-processing/Dockerfile 2>/dev/null | wc -l)
          echo "✅ Temurin 命中=${ACTUAL_TEMURIN}/${EXPECT_TEMURIN}（processing 保持 flink:1.16-java8 正常）"
          echo "✅ 5 个 Java Dockerfile FROM openjdk → temurin 修复完成（仅 Runner 工作目录临时修改，不入库）"

      # ==================================================
      # 部署阶段：Docker Compose 本地 build + up -d + health + Smoke 5 条 HTTP
      # compose include 三层兼容：原生（v2.20+）→ yq flatten → sed 手工拼接兜底
      # ==================================================
      - name: Docker Compose 本地构建 + Quick 模式部署 + Smoke 基础 5 条（含 compose < v2.20 include 兼容兜底）
        working-directory: docker-compose
        shell: bash
        env:
          AITEST_TOKEN_SECRET: ${{ secrets.AITEST_TOKEN_SECRET || '' }}
        run: |
          set -euo pipefail
          LOG=/tmp/s18_compose.log
          : > "$LOG"
          BASE=$(pwd)
          REPO_DC_DIR="${BASE}"
          REPO_ROOT="$(cd "${BASE}/.." && pwd)"
          RUNTIME_ROOT="${AITEST_RUNTIME_ROOT}"
          RUN_DC_DIR="${RUNTIME_ROOT}/docker-compose"
          mkdir -p "${RUNTIME_ROOT}" 2>/dev/null || true
          rm -rf "${RUN_DC_DIR}" 2>/dev/null || true
          mkdir -p "${RUN_DC_DIR}" 2>/dev/null || true
          tar -C "${REPO_DC_DIR}" --exclude='./clklog_dc_data' -cf - . | tar -C "${RUN_DC_DIR}" -xf -
          cd "${RUN_DC_DIR}"
          BASE=$(pwd)
          SRC_ROOT="${REPO_ROOT}"
          echo "=== [S18] cwd=${BASE}  ls docker-compose/:" | tee -a "$LOG"
          ls -la 2>&1 | tee -a "$LOG" | head -40 || true
          echo "=== [S18] .env 三级容错复制（.env → .env.example → 空文件）===" | tee -a "$LOG"
          if [ -f .env ]; then
            cp .env .env.local.test
            echo "[env] 使用 .env 作为 .env.local.test" | tee -a "$LOG"
          elif [ -f .env.example ]; then
            cp .env.example .env.local.test
            echo "[env] ⚠️  .env 不存在，fallback 复制 .env.example 作为 .env.local.test（默认值应够 Smoke）" | tee -a "$LOG"
          else
            : > .env.local.test
            echo "[env] ⚠️  .env / .env.example 均不存在，创建空 .env.local.test（compose 自有默认值仍生效）" | tee -a "$LOG"
          fi
          export COMPOSE_PROJECT_NAME="${AITEST_COMPOSE_PROJECT_NAME}"
          echo "[compose] project=${COMPOSE_PROJECT_NAME}" | tee -a "$LOG"

          WORK_YML="docker-compose-clklog-simple.yml"
          echo "=== [S18] 检查主 compose 文件 ${WORK_YML} 存在性 ===" | tee -a "$LOG"
          if [ ! -f "${WORK_YML}" ]; then
            echo "❌ [FATAL] 主 compose 文件不存在: ${WORK_YML}" | tee -a "$LOG"
            ls -la *.yml *.yaml 2>/dev/null || true | tee -a "$LOG"
            exit 1
          fi
          cp "${WORK_YML}" "${WORK_YML}.bak-aitest-${SHA}"
          echo "[compose] 备份: ${WORK_YML}.bak-aitest-${SHA}" | tee -a "$LOG"

          DC_VER=$(docker compose version --short 2>/dev/null || echo "0.0.0")
          DC_MAJ=$(echo "$DC_VER" | cut -d. -f1)
          DC_MIN=$(echo "$DC_VER" | cut -d. -f2)
          echo "[compose] version=${DC_VER} (maj=${DC_MAJ}, min=${DC_MIN})" | tee -a "$LOG"
          set +o pipefail
          {
          INCLUDE_OK=1
          if [ "${DC_MAJ}" -lt 2 ] || { [ "${DC_MAJ}" -eq 2 ] && [ "${DC_MIN}" -lt 20 ]; }; then
            echo "[compose] <v2.20 → flatten 兜底"
            INCLUDE_OK=0
          else
            echo "[compose] >=v2.20 → 探测原生 include"
            set +e
            PROBE_ERR=$(docker compose -f "${WORK_YML}" --env-file .env.local.test config --quiet 2>&1)
            PROBE_RC=$?
            set -e
            if [ "${PROBE_RC}" -ne 0 ]; then
              echo "[compose] 原生 include 失败 rc=${PROBE_RC}，flatten 兜底。stderr："
              echo "${PROBE_ERR}" | head -n 15
              INCLUDE_OK=0
            else
              echo "[compose] 原生 include ✅"
            fi
          fi

          if [ "${INCLUDE_OK}" -eq 0 ]; then
            BASE_YML="${BASE}/docker-compose-clklog-simple-base.yml"
            FLAT_YML="${WORK_YML}.no-include.flat.yml"
            echo "[compose] flatten → yq eval-all，yq不可用时sed手工兜底"
            if command -v yq >/dev/null 2>&1; then
              yq eval 'del(.include)' "${WORK_YML}" > "${WORK_YML}.tmp.no-include.yml"
              YQ_FILTER='select(fileIndex == 0) as $base | select(fileIndex == 1) as $work | $work *+ {"services": (($base.services // {}) *+ ($work.services // {}))} *+ {"networks": (($base.networks // {}) *+ ($work.networks // {}))}'
              yq eval-all "${YQ_FILTER}" "${BASE_YML}" "${WORK_YML}.tmp.no-include.yml" > "${FLAT_YML}"
              echo "[compose] flatten (yq) done"
            else
              {
                echo 'version: "3"'
                echo ""
                echo "services:"
                sed -n '/^services:/,/^[a-zA-Z]/p' "${BASE_YML}" 2>/dev/null | sed '1d;$d'
                echo ""
                sed -n '/^services:/,/^[a-zA-Z]/p' "${WORK_YML}" 2>/dev/null | sed '1d;$d' | sed -E '/^include:/d'
                echo ""
                echo "networks:"
                sed -n '/^networks:/,$p' "${BASE_YML}" 2>/dev/null | sed '1d' || echo "  frontend: {}"$'\n'"  backend: {}"
              } > "${FLAT_YML}"
              echo "[compose] flatten (sed手工) done"
            fi
            WORK_YML="${FLAT_YML}"
          fi

          IMG_TAG="${LOCAL_TAG}"
          echo "[compose] Resolve real JAR filenames directly from target/ dir (100% bypass pom xml parse VERSION bugs)"
          RESOLVE_FAIL=0
          for key in MANAGE:clklog-manage API:clklog-api RECEIVER:clklog-receiver PROCESSING:clklog-processing INIT:clklog-init; do
            svc_uc="${key%%:*}"; dir="${key##*:}"
            d="${SRC_ROOT}/clklog/${dir}/target"
            jarfile=$(ls -1 "${d}"/*.jar 2>/dev/null | grep -v -E 'sources|javadoc|tests|original' | head -1)
            if [ -z "${jarfile}" ]; then
              echo "  ❌ FATAL ${dir}: NO JAR in ${d}. ls for debug:"
              ls -la "${d}" 2>&1 | head -20 || true; RESOLVE_FAIL=1; continue
            fi
            bn=$(basename "${jarfile}")
            varname="JAR_FILE_${svc_uc}"
            declare "${varname}=target/${bn}"
            echo "  ✅ ${dir}: ${varname}=target/${bn}"
          done
          if [ "${RESOLVE_FAIL}" -ne 0 ]; then echo "[FATAL] JAR glob resolve failed, stop"; exit 2; fi
          echo "[compose] FINAL JARs: M=${JAR_FILE_MANAGE} A=${JAR_FILE_API} R=${JAR_FILE_RECEIVER} P=${JAR_FILE_PROCESSING} I=${JAR_FILE_INIT}"
          echo "[compose] 写入镜像/构建上下文 LOCAL_TAG=${IMG_TAG}"
          if command -v yq >/dev/null 2>&1; then
            BASE_YML="docker-compose-clklog-simple-base.yml"
            if [ -n "${AITEST_TOKEN_SECRET:-}" ]; then
              TOKEN_SECRET_VAL="${AITEST_TOKEN_SECRET}"
              echo "[compose] token_secret source = GitHub Secrets (SET)"
            else
              TOKEN_SECRET_VAL=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 128)
              echo "[compose] token_secret source = generated-ephemeral-128 (Secrets UNSET, smoke-only)"
            fi
            yq eval '.services.clklog-manage.image     = "local/clklog-manage:'${IMG_TAG}'"
                  | .services.clklog-manage.build.context = "'"${SRC_ROOT}/clklog/clklog-manage"'"
                  | .services.clklog-manage.build.dockerfile = "Dockerfile"
                  | .services.clklog-manage.build.args.JAR_FILE = "'"${JAR_FILE_MANAGE}"'"
                  | .services.clklog-manage.environment = (.services.clklog-manage.environment // []) + ["token_secret='"${TOKEN_SECRET_VAL}"'", "TOKEN_SECRET='"${TOKEN_SECRET_VAL}"'", "redis_host=redis", "redis_port=6379"]
                  | .services.clklog-api.image        = "local/clklog-api:'${IMG_TAG}'"
                  | .services.clklog-api.build.context = "'"${SRC_ROOT}/clklog/clklog-api"'"
                  | .services.clklog-api.build.dockerfile = "Dockerfile"
                  | .services.clklog-api.build.args.JAR_FILE = "'"${JAR_FILE_API}"'"
                  | .services.clklog-api.environment = (.services.clklog-api.environment // []) + ["token_secret='"${TOKEN_SECRET_VAL}"'", "TOKEN_SECRET='"${TOKEN_SECRET_VAL}"'", "redis_host=redis", "redis_port=6379", "SPRING_SECURITY_USER_NAME=admin", "SPRING_SECURITY_USER_PASSWORD=admin"]
                  | .services.clklog-receiver.image   = "local/clklog-receiver:'${IMG_TAG}'"
                  | .services.clklog-receiver.build.context = "'"${SRC_ROOT}/clklog/clklog-receiver"'"
                  | .services.clklog-receiver.build.dockerfile = "Dockerfile"
                  | .services.clklog-receiver.build.args.JAR_FILE = "'"${JAR_FILE_RECEIVER}"'"
                  | .services.clklog-receiver.environment = (.services.clklog-receiver.environment // []) + ["redis_host=redis", "redis_port=6379"]
                  | .services.clklog-processing.image = "local/clklog-processing:'${IMG_TAG}'"
                  | .services.clklog-processing.build.context = "'"${SRC_ROOT}/clklog/clklog-processing"'"
                  | .services.clklog-processing.build.dockerfile = "Dockerfile"
                  | .services.clklog-processing.build.args.JAR_FILE = "'"${JAR_FILE_PROCESSING}"'"
                  | .services.clklog-init.image       = "local/clklog-init:'${IMG_TAG}'"
                  | .services.clklog-init.build.context = "'"${SRC_ROOT}/clklog/clklog-init"'"
                  | .services.clklog-init.build.dockerfile = "Dockerfile"
                  | .services.clklog-init.build.args.JAR_FILE = "'"${JAR_FILE_INIT}"'"
                  | .services.clklog-ui.image         = "local/clklog-ui:'${IMG_TAG}'"
                  | .services.clklog-ui.build.context = "'"${SRC_ROOT}/clklog/clklog-ui"'"
                  | .services.clklog-ui.build.dockerfile = "Dockerfile"
                  | .services.clklog-ui.build.args.HTML_DIR = "dist"
                  | .services.gateway.ports = [(env(AITEST_GATEWAY_PORT) + ":80")]
                  ' -i "${WORK_YML}"
            echo "[compose] yq 写入完成（gateway port=${AITEST_GATEWAY_PORT}；manage/api token_secret+api安全账号 + redis_host/port 兜底）"
          else
            echo "[compose] yq 不可用，跳过 LOCAL_TAG 写入（沿用yml原有默认值即可，不阻断主流程）"
          fi

          echo "========== services 片段 =========="
          if command -v yq >/dev/null 2>&1; then
            yq '.services | with_entries(select(.key | test("^(clklog|gateway|redis|clickhouse|mysql)$"))) | with_entries(.value |= del(.environment))' "${WORK_YML}"
          else
            echo "(yq不可用，跳过美化)"
            head -n 120 "${WORK_YML}"
          fi

          DC_CMD="docker compose -f ${WORK_YML} --env-file .env.local.test"
          echo "========== 清理旧容器 project=${COMPOSE_PROJECT_NAME} =========="
          ${DC_CMD} down -v --remove-orphans 2>/dev/null || true

          if [ "${KEEP_AITEST_UP:-false}" = "true" ]; then
            LIVE_IDS=$(docker ps -aq --filter label=com.docker.compose.project=clklog-aitest-live 2>/dev/null || true)
            if [ -n "${LIVE_IDS}" ]; then
              echo "========== keep_aitest_up=true: removing previous clklog-aitest-live containers =========="
              echo "${LIVE_IDS}" | xargs -r docker rm -f || true
            fi
          fi

          echo "========== 预创建 bind mount 目录 + 统一放宽权限（避免 redis logfile permission denied）=========="
          mkdir -p clklog_dc_data/redis clklog_dc_data/mysql/data clklog_dc_data/clickhouse clklog_dc_data/clickhouse/log clklog_dc_data/initlog clklog_dc_data/receiver 2>/dev/null || true
          chmod -R a+rwx clklog_dc_data/redis 2>/dev/null || true

          echo "========== compose build: manage/api/receiver/processing/init/ui =========="
          ${DC_CMD} build --no-cache clklog-manage clklog-api clklog-receiver clklog-processing clklog-init clklog-ui

          echo "========== compose up -d Quick 模式 =========="
          ${DC_CMD} up -d

          echo "========== sleep 200 秒（6 容器启动+健康检查，init 执行略慢）=========="
          sleep 200
          echo "========== 容器状态 =========="
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

          echo "========== Smoke 基础 5 条 HTTP（网关路由对齐）=========="
          export AITEST_GATEWAY="http://127.0.0.1:${AITEST_GATEWAY_PORT}"
          echo "GATEWAY = $AITEST_GATEWAY"
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "AITEST_PUBLIC_URL=http://${HOST_IP}:${AITEST_GATEWAY_PORT}"
          fail=0
          # 1 UI 首页
          C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$AITEST_GATEWAY/" || echo "000")
          if echo "$C" | grep -qE '^200$|^302$'; then echo "✅ [1/5] HTTP $C UI 首页"; else echo "❌ [1/5] HTTP $C UI 首页 → $AITEST_GATEWAY/"; fail=1; fi

          # 2 manage health
          C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$AITEST_GATEWAY/manage/actuator/health" || echo "000")
          if [ "$C" = "200" ]; then echo "✅ [2/5] HTTP $C manage health"; else echo "❌ [2/5] HTTP $C manage health → $AITEST_GATEWAY/manage/actuator/health"; fail=1; fi

          # 3 api health
          API_OK=0
          C="000"
          for _ in 1 2 3 4 5 6; do
            C=$(curl -s -u admin:admin -o /dev/null -w "%{http_code}" --max-time 15 "$AITEST_GATEWAY/api/actuator/health" || echo "000")
            if [ "$C" = "200" ]; then API_OK=1; break; fi
            sleep 10
          done
          if [ "$API_OK" = "1" ]; then echo "✅ [3/5] HTTP $C api health"; else echo "❌ [3/5] HTTP $C api health → $AITEST_GATEWAY/api/actuator/health"; fail=1; fi

          # 4 receiver health
          C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$AITEST_GATEWAY/receiver/actuator/health" || echo "000")
          if [ "$C" = "200" ]; then echo "✅ [4/5] HTTP $C receiver health"; else echo "❌ [4/5] HTTP $C receiver health → $AITEST_GATEWAY/receiver/actuator/health"; fail=1; fi

          # 5 init container healthy
          INIT_CONT=$(docker ps --format '{{.Names}}' | grep clklog-init | head -1)
          if [ -z "$INIT_CONT" ]; then
            echo "❌ [5/5] 未找到 clklog-init 容器"; fail=1
          else
            ST=$(docker inspect -f '{{.State.Health.Status}}' "$INIT_CONT" 2>/dev/null || echo "unknown")
            if [ "$ST" = "healthy" ] || [ "$ST" = "none" ]; then
              echo "✅ [5/5] init container = $ST ($INIT_CONT)"
            else
              echo "❌ [5/5] init container = $ST ($INIT_CONT)"; fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "===== SMOKE FAILED — 5 业务容器 logs 尾 250 行 ====="
            DC_CMD="docker compose -f ${WORK_YML} --env-file .env.local.test"
            ${DC_CMD} logs --tail=250 clklog-manage clklog-api clklog-receiver clklog-processing clklog-init clklog-ui 2>&1 || true
            echo "===== 失败快照保留 ====="
            echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME"
            echo "WORK_YML 快照: $(pwd)/${WORK_YML}"
            echo "bak: $(pwd)/docker-compose-clklog-simple.yml.bak-aitest-${SHA}"
            if [ -n "${FLAT_YML:-}" ] && [ -f "${FLAT_YML}" ]; then
              echo "FLAT_YML: $(pwd)/${FLAT_YML}"
            fi
            echo ".env.local.test (脱敏):"
            sed -E 's/(PASS.*=|TOKEN.*=|SECRET.*=|KEY.*=).*/\1***MASKED***/g' .env.local.test | head -n 30
            exit 1
          fi

          echo "=================================================================="
          echo " ✅ aitest 分支 SHA=$SHA 单 job 自洽（本地构建+compose 部署）全绿"
          echo "    Smoke 基础 5/5 全部通过，Gateway = $AITEST_GATEWAY"
          echo "=================================================================="
          } 2>&1 | tee -a "$LOG" | tail -n 200
          RC=${PIPESTATUS[0]}
          set -o pipefail
          echo "[S18] FINAL_RC=${RC}"
          if [ "${RC}" != "0" ]; then
            echo "===== S18 FAIL — full log head 400 ====="
            head -n 400 "$LOG" 2>/dev/null || true
            echo "===== S18 FAIL — full log tail 500 ====="
            tail -n 500 "$LOG" 2>/dev/null || true
            exit "${RC}"
          fi
          exit "${RC}"

      - name: 离线固化用例 01-05 顺序执行（scripts/aitest 目录，缺失则 SKIP 不失败）
        shell: bash
        env:
          AITEST_USER:     ${{ secrets.AITEST_USER     || 'admin' }}
          AITEST_PASS:     ${{ secrets.AITEST_PASS     || 'admin123' }}
          AITEST_CH_USER:  ${{ secrets.AITEST_CH_USER  || 'default' }}
          AITEST_CH_PASS:  ${{ secrets.AITEST_CH_PASS  || '' }}
        run: |
          LOG=/tmp/s19_offline.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set -euo pipefail
          HOST_IP=$(hostname -I | awk '{print $1}')
          export AITEST_GATEWAY="http://${HOST_IP}:${AITEST_GATEWAY_PORT}"
          export AITEST_API_USER="admin"
          export AITEST_API_PASS="admin"
          if [ ! -d "scripts/aitest" ]; then
            echo "⚠️  scripts/aitest 目录不存在（首次接入空窗期），SKIP 离线固化用例阶段"
            exit 0
          fi
          cd scripts/aitest
          FAIL=0
          SCRIPTS=("01_smoke_http.sh" "02_api_login.sh" "03_receiver_track.sh" "04_ch_query.sh" "05_ui_render.sh")
          for f in "${SCRIPTS[@]}"; do
            if [ -f "$f" ]; then
              sed -i 's/\r$//' "$f" || true
            fi
          done
          for f in "${SCRIPTS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "⚠️  [SKIP] $f 未编写，后续按需补齐"
              continue
            fi
            echo "========== RUN $f =========="
            set +e
            bash "$f"
            RC=$?
            set -e
            if [ "${RC}" -ne 0 ]; then
              echo "❌ FAIL $f exit_code=${RC}"
              FAIL=1
            fi
          done
          if [ "${FAIL}" -ne 0 ]; then exit 1; fi
          echo "✅ 离线固化用例阶段完成（Secrets 未注入时 02~05 在脚本内自行 SKIP，不阻断主 run）"

      - name: Archive test results to versioned directory
        if: ${{ always() }}
        shell: bash
        run: |
          echo "[archive] Archiving test results to ${AITEST_TEST_RESULTS_DIR}"
          mkdir -p "${AITEST_TEST_RESULTS_DIR}"
          # 复制所有测试日志
          cp /tmp/s0_preclean.log "${AITEST_TEST_RESULTS_DIR}/" 2>/dev/null || true
          cp /tmp/s18_compose.log "${AITEST_TEST_RESULTS_DIR}/" 2>/dev/null || true
          cp /tmp/s19_offline.log "${AITEST_TEST_RESULTS_DIR}/" 2>/dev/null || true
          cp /tmp/s99_postclean.log "${AITEST_TEST_RESULTS_DIR}/" 2>/dev/null || true
          # 复制构建产物信息
          echo "SHA=${SHA}" > "${AITEST_TEST_RESULTS_DIR}/build_info.txt"
          echo "LOCAL_TAG=${LOCAL_TAG}" >> "${AITEST_TEST_RESULTS_DIR}/build_info.txt"
          echo "COMPOSE_PROJECT_NAME=${AITEST_COMPOSE_PROJECT_NAME}" >> "${AITEST_TEST_RESULTS_DIR}/build_info.txt"
          echo "[archive] Test results archived to ${AITEST_TEST_RESULTS_DIR}"

      - name: Update current symlink for keep_aitest_up mode
        if: ${{ always() && env.KEEP_AITEST_UP == 'true' }}
        shell: bash
        run: |
          echo "[symlink] Updating current symlink to ${SHA}"
          ln -sfn "/mnt/data/testing/aitest/versions/${SHA}" /mnt/data/testing/aitest/current
          echo "[symlink] Current symlink updated: /mnt/data/testing/aitest/current -> /mnt/data/testing/aitest/versions/${SHA}"

      - name: Post-clean Runner workspace + aitest docker residues
        if: ${{ always() && env.KEEP_AITEST_UP != 'true' }}
        shell: bash
        run: |
          set -u
          set -o pipefail 2>/dev/null || true
          exec > >(tee /tmp/s99_postclean.log) 2>&1 || true
          echo "[postclean] start"

          RUN_DC_DIR="${AITEST_RUNTIME_ROOT}/docker-compose"
          if [ -d "${RUN_DC_DIR}" ]; then
            cd "${RUN_DC_DIR}"
            if [ -f "docker-compose-clklog-simple.yml" ] && [ -f ".env.local.test" ]; then
              export COMPOSE_PROJECT_NAME="${AITEST_COMPOSE_PROJECT_NAME}"
              docker compose -f docker-compose-clklog-simple.yml --env-file .env.local.test down -v --remove-orphans 2>/dev/null || true
            fi
          fi

          IDS_FILE="$(mktemp)"
          NETS_FILE="$(mktemp)"
          VOLS_FILE="$(mktemp)"
          docker ps -aq --filter name=clklog-aitest- > "${IDS_FILE}" 2>/dev/null || true
          if [ -s "${IDS_FILE}" ]; then
            cat "${IDS_FILE}" | xargs -r docker rm -f || true
          fi
          docker network ls -q --filter name=clklog-aitest- > "${NETS_FILE}" 2>/dev/null || true
          if [ -s "${NETS_FILE}" ]; then
            cat "${NETS_FILE}" | xargs -r docker network rm || true
          fi
          docker volume ls -q --filter name=clklog-aitest- > "${VOLS_FILE}" 2>/dev/null || true
          if [ -s "${VOLS_FILE}" ]; then
            cat "${VOLS_FILE}" | xargs -r docker volume rm || true
          fi

          # 清理版本化的运行时目录（非 live 模式）
          if [ -d "${AITEST_RUNTIME_ROOT}" ]; then
            chmod -R a+rwx "${AITEST_RUNTIME_ROOT}/docker-compose/clklog_dc_data" 2>/dev/null || true
            rm -rf "${AITEST_RUNTIME_ROOT}/docker-compose" 2>/dev/null || true
            # 如果 test-results 已归档，可以删除整个版本目录
            if [ -d "/mnt/data/testing/aitest/versions/${SHA}/test-results" ]; then
              rm -rf "${AITEST_RUNTIME_ROOT}" 2>/dev/null || true
            fi
          fi
          
          # 清理旧的 github-runner 工作目录（向后兼容）
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          WS="/mnt/data/github-runner/_work/${REPO_NAME}/${REPO_NAME}"
          if [ -d "${WS}" ]; then
            chmod -R a+rwx "${WS}/docker-compose/clklog_dc_data" 2>/dev/null || true
            rm -rf "${WS}/docker-compose/clklog_dc_data" 2>/dev/null || true
          fi
          
          echo "[postclean] done"

      - name: Print AITEST access URL (when kept up)
        if: ${{ always() && env.KEEP_AITEST_UP == 'true' }}
        shell: bash
        run: |
          set -u
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "AITEST_PUBLIC_URL=http://${HOST_IP}:${AITEST_GATEWAY_PORT}"
