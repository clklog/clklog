name: ClkLog Release Pipeline

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*", "v*.*.*.*"]
  workflow_dispatch:
    inputs:
      test_mode:
        description: "测试模式（true = build 不 push，Secrets 未配置不红）"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      service:
        description: "仅重建单个服务（默认 all = 全量发布流程；指定单服务则只 rebuild + push 镜像，不重建 Release / 不同步 Gitee）"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "manage"
          - "api"
          - "receiver"
          - "processing"
          - "init"
          - "ui"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "8"
  JAVA_DISTRO: "temurin"
  NODE_VERSION: "18"
  UI_DIR: clklog/clklog-ui
  ALIYUN_NS_SUFFIX: "clklog"
  CLKLOG_VERSION: ${{ github.ref_name }}
  DOCKER_TAG: ${{ github.ref_name }}
  OUTPUT_DIR: release-output
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  CLKLOG_SHORT_SHA: ""

# 拆分后的 Job DAG：
#   setup（解析矩阵 + service 输入）─┬─► build (matrix×N, 无需审批) ──► docker (matrix×N, 无需审批)
#                                   └─► package (仅 checkout, 无需审批) ─┐
#                                                                       └─► release (无需审批) ──► sync-gitee (release-prod 审批门)
#   （docker 与 package 互不依赖、可并行；release 等二者；sync 等 release）
#   特权边界：仅「同步到 Gitee」属于特权操作，需 release-prod Environment 审批；阿里云 ACR push 与 GitHub Release 发布均无需审批。
#   单服务重建：workflow_dispatch 选 service≠all 时，full_release=false → 只跑 build+docker（仅重建 + push 该镜像），
#              自动跳过 package / release / sync-gitee（不重建 Release、不同步 Gitee）。
#   说明：原单 job 内「6 个子项目平铺到根目录」已移除，docker 直接用 clklog/clklog-<short> 作 build context（与 ci.yml 一致）。
#   矩阵单一事实源：6 个子服务的 name/dir/lang/jar_suffix/short(及 docker 的 ali) 由 setup job 统一定义，与 ci.yml 对齐。

jobs:
  # ─────────────────────────────────────────────────────────────
  # 0) setup：单一事实源，定义 6 个子服务的构建矩阵（字段与 ci.yml build-matrix 对齐），
  #    并依据 workflow_dispatch 的 service 输入决定 full_release（全量发布 / 单服务重建）
  # ─────────────────────────────────────────────────────────────
  setup:
    name: 解析构建矩阵 / 发布模式
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set.outputs.build_matrix }}
      docker_matrix: ${{ steps.set.outputs.docker_matrix }}
      full_release: ${{ steps.set.outputs.full_release }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          SVC="${{ github.event.inputs.service || 'all' }}"
          SERVICES='[
            {"name":"clklog-manage","dir":"clklog/clklog-manage","lang":"java","jar_suffix":"","short":"manage","ali":"manage"},
            {"name":"clklog-api","dir":"clklog/clklog-api","lang":"java","jar_suffix":"","short":"api","ali":"api"},
            {"name":"clklog-receiver","dir":"clklog/clklog-receiver","lang":"java","jar_suffix":"","short":"receiver","ali":"receiver"},
            {"name":"clklog-processing","dir":"clklog/clklog-processing","lang":"java","jar_suffix":"-jar-with-dependencies","short":"processing","ali":"processing"},
            {"name":"clklog-init","dir":"clklog/clklog-init","lang":"java","jar_suffix":"","short":"init","ali":"init"},
            {"name":"clklog-ui","dir":"clklog/clklog-ui","lang":"node","jar_suffix":"","short":"ui","ali":"ui"}
          ]'
          if [ "$SVC" = "all" ] || [ -z "$SVC" ]; then
            SELECTED="$SERVICES"
            FULL="true"
          else
            SELECTED="$(printf '%s' "$SERVICES" | jq --arg s "$SVC" 'map(select(.short==$s or .name==$s))')"
            FULL="false"
          fi
          BUILD_M="$(printf '%s' "$SELECTED" | jq -c '{include: map(del(.ali))}')"
          DOCKER_M="$(printf '%s' "$SELECTED" | jq -c '{include: .}')"
          {
            echo "build_matrix=$BUILD_M"
            echo "docker_matrix=$DOCKER_M"
            echo "full_release=$FULL"
          } >> "$GITHUB_OUTPUT"
          echo "selected services:"; printf '%s' "$SELECTED" | jq -r '.[].short | "  - "+.'
          echo "full_release=$FULL"

  # ─────────────────────────────────────────────────────────────
  # 1) build：并行构建 N 个子项目（Java verify / Node build），
  #    产出 jar/dist + 已修正的 Dockerfile + 版本号，供 docker job 使用
  # ─────────────────────────────────────────────────────────────
  build:
    name: build-${{ matrix.short }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8 + Maven cache
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Setup Node 18
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        if: matrix.lang == 'node'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/node_modules
          key: ${{ runner.os }}-release-node-modules-${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', matrix.dir)) }}
          restore-keys: |
            ${{ runner.os }}-release-node-modules-${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package.json', matrix.dir)) }}-
            ${{ runner.os }}-release-node-modules-${{ env.NODE_VERSION }}-

      - name: Build Java (clean verify · jacoco LINE≥80% 由 quality-gate 承担)
        id: build_java
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw mvnw.cmd 2>/dev/null || true
          if [ -x ./mvnw ]; then
            ./mvnw -B -ntp clean verify -DskipITs
          else
            mvn -B -ntp clean verify -DskipITs
          fi
          V=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "ver=$V" >> $GITHUB_OUTPUT
          echo "$V" > version.txt
          echo "detected pom version = $V (service=${{matrix.name}})"

      - name: Build Node (npm ci → test:unit → build dist)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider"
          npm ci
          npm run test:unit --if-present -- --ci --passWithNoTests
          npm run build --if-present

      - name: 修复 Dockerfile Base Image（java 非 processing · 仅 Runner 内存修改，不入库）
        if: matrix.lang == 'java' && matrix.name != 'clklog-processing'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la Dockerfile
          ORIG="$(head -1 Dockerfile)"
          sed -i -E 's/^FROM openjdk:8(u[0-9]+-[a-z]+)?$/FROM eclipse-temurin:8u422-b05-jdk/' Dockerfile
          NEW="$(head -1 Dockerfile)"
          echo "FROM line: [$ORIG] -> [$NEW]"

      - name: 上传服务产物（jar/dist + Dockerfile + 版本号，供 docker job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: svc-${{ matrix.short }}
          path: ${{ matrix.dir }}
          exclude: |
            ${{ matrix.dir }}/node_modules/**
            ${{ matrix.dir }}/.git/**
            **/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2) package：仅 checkout，打 compose / source / docs 三个 tar（与 build 并行）
  # ─────────────────────────────────────────────────────────────
  package:
    name: package-assets
    needs: [setup]
    if: needs.setup.outputs.full_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 计算 SHORT_SHA（7 位）
        id: sha
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "CLKLOG_SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          echo "GITHUB_SHA=${GITHUB_SHA}  SHORT_SHA=${SHORT_SHA}"
          echo "::notice::Source code (zip)/(tar.gz) 是 GitHub 针对 tag 自动生成的仓库快照：GitHub 不提供删除/禁用开关，它不属于 release assets，CI 侧 API 无法删除；无需处理。"

      - name: 替换 compose .env VER_PLACEHOLDER → 当前 tag（仅 Runner 内存副本，不入库）
        run: |
          set -euo pipefail
          BASE="$(pwd)"
          TAG="${CLKLOG_VERSION}"
          mkdir -p "${BASE}/${OUTPUT_DIR}"
          cp -R "${BASE}/docker-compose" "${BASE}/${OUTPUT_DIR}/__compose_env_pack"
          sed -i "s/VER_PLACEHOLDER/${TAG}/g" "${BASE}/${OUTPUT_DIR}/__compose_env_pack/.env"

      - name: Pack compose tar（临时 _g${SHORT_SHA} 后缀，上传后改名回友好名）
        run: |
          set -euo pipefail
          BASE="$(pwd)"
          TAG="${CLKLOG_VERSION}"
          SHA="${CLKLOG_SHORT_SHA}"
          COMPOSE_BASENAME="clklog-docker-compose"
          COMPOSE_DIR="${BASE}/${OUTPUT_DIR}/${COMPOSE_BASENAME}"
          mkdir -p "${COMPOSE_DIR}"
          SRC_DC="${BASE}/${OUTPUT_DIR}/__compose_env_pack"
          cp -v "${SRC_DC}/docker-compose-clklog-simple.yml" \
                "${SRC_DC}/docker-compose-clklog-simple-base.yml" \
                "${SRC_DC}/docker-compose-clklog-full.yml" \
                "${SRC_DC}/docker-compose-clklog-full-base.yml" \
                "${SRC_DC}/.env" \
                "${SRC_DC}/clklog_init.sh" \
                -t "${COMPOSE_DIR}/"
          cp -R "${SRC_DC}/clklog_dc_config" "${COMPOSE_DIR}/"
          cd "${BASE}/${OUTPUT_DIR}"
          tar --exclude='clklog_dc_data' \
              --exclude='*.log' \
              -czf "${COMPOSE_BASENAME}-${TAG}_g${SHA}.tar.gz" "${COMPOSE_BASENAME}"
          if tar tzf "${COMPOSE_BASENAME}-${TAG}_g${SHA}.tar.gz" | grep -q "clklog_dc_data"; then
            echo "::error::compose tar 包含数据卷 clklog_dc_data，打包失败"; exit 1
          fi

      - name: Pack 源码包 + docs 包（临时 _g${SHORT_SHA} 后缀，上传后改名回友好名）
        run: |
          set -euo pipefail
          BASE="$(pwd)"
          TAG="${CLKLOG_VERSION}"
          OUT="${BASE}/${OUTPUT_DIR}"
          SHA="${CLKLOG_SHORT_SHA}"
          cd "${BASE}"
          tar --exclude='node_modules' \
              --exclude='target' \
              --exclude='dist' \
              --exclude='.git' \
              --exclude='*.log' \
              -czf "${OUT}/clklog-source-${TAG}_g${SHA}.tar.gz" clklog
          if tar tzf "${OUT}/clklog-source-${TAG}_g${SHA}.tar.gz" | grep -Eq '^/home|^/runner|/node_modules/|/target/|/dist/|\.log$'; then
            echo "::error::源码包包含绝对路径/构建产物/日志，打包失败"; exit 1
          fi
          cd "${BASE}"
          if [ ! -d docs ]; then
            echo "::error::仓库根目录缺少 docs/，请先补齐后再发版"; exit 1
          fi
          tar --exclude='*.log' \
              -czf "${OUT}/clklog-docs-${TAG}_g${SHA}.tar.gz" docs
          if tar tzf "${OUT}/clklog-docs-${TAG}_g${SHA}.tar.gz" | grep -Eq '^/home|^/runner|\.log$'; then
            echo "::error::docs 包包含绝对路径/日志，打包失败"; exit 1
          fi

      - name: 上传 3 个打包资源产物
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3) docker：并行 build + push 6 个镜像到阿里云 ACR（非特权，无需审批）
  # ─────────────────────────────────────────────────────────────
  docker:
    name: docker-${{ matrix.short }}
    needs: [build, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup.outputs.docker_matrix) }}
    steps:
      # 注意：build job 上传的是单目录（path: clklog/clklog-<short>），upload-artifact v4
      # 对单目录的 artifact 根=该目录本身，故下载后 Dockerfile/version.txt/target|dist 平铺于 workspace 根；
      # 本 job 无 checkout，所有构建操作直接在 workspace 根进行（不可用 matrix.dir，该目录不存在）。
      - name: 下载 build 产物（Dockerfile/version.txt/target|dist 平铺于 workspace 根）
        uses: actions/download-artifact@v4
        with:
          name: svc-${{ matrix.short }}
          path: ${{ github.workspace }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 判定 Push 开关（阿里云 ACR）
        id: check_push_ok
        run: |
          set -euo pipefail
          TEST_MODE="${{ github.event.inputs.test_mode || 'false' }}"
          ALIYUN_NS_SUFFIX="${ALIYUN_NS_SUFFIX}"
          ALIYUN_OK="true"
          if [ "$TEST_MODE" = "true" ]; then ALIYUN_OK="false"; fi
          if [ -z "${ALIYUN_REGISTRY_SECRET:-}" ]; then ALIYUN_OK="false"; fi
          if [ -z "${ALIYUN_USERNAME_SECRET:-}" ]; then ALIYUN_OK="false"; fi
          if [ -z "${ALIYUN_PASSWORD_SECRET:-}" ]; then ALIYUN_OK="false"; fi
          if echo "${ALIYUN_REGISTRY_SECRET:-}" | grep -q "registry.example.com"; then ALIYUN_OK="false"; fi
          SHOULD_PUSH="${ALIYUN_OK}"
          echo "should_push=${SHOULD_PUSH}"   >> $GITHUB_OUTPUT
          echo "push_aliyun_ok=${ALIYUN_OK}"  >> $GITHUB_OUTPUT
          echo "TEST_MODE=$TEST_MODE, ALIYUN_NS_SUFFIX=$ALIYUN_NS_SUFFIX"
          echo "ALIYUN Secrets: R=${ALIYUN_REGISTRY_SECRET:-<UNSET>}, U=${ALIYUN_USERNAME_SECRET:+SET}, P=${ALIYUN_PASSWORD_SECRET:+SET} → push_aliyun_ok=$ALIYUN_OK"
          echo "should_push(total)=$SHOULD_PUSH"
        env:
          ALIYUN_REGISTRY_SECRET: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME_SECRET: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD_SECRET: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 登录阿里云 ACR
        id: login_aliyun
        if: steps.check_push_ok.outputs.push_aliyun_ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 标记阿里云 ACR 登录成功
        id: post_login_aliyun
        if: steps.check_push_ok.outputs.push_aliyun_ok == 'true'
        run: echo "login_ok=true" >> $GITHUB_OUTPUT

      - name: Build + Push 单镜像（仅阿里云 ACR · workspace 根，artifact 已平铺）
        env:
          ALIYUN_REGISTRY_SECRET: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME_SECRET: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD_SECRET: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="$(pwd)"
          ALIYUN_NS_SUFFIX="${ALIYUN_NS_SUFFIX}"
          TAG="${DOCKER_TAG}"
          ALIYUN_REG="${ALIYUN_REGISTRY_SECRET:-}"
          PUSH_ALI=0
          if [ "${{ steps.post_login_aliyun.outputs.login_ok || 'false' }}" = "true" ]; then PUSH_ALI=1; fi
          name="${{ matrix.name }}"
          df="Dockerfile"
          js="${{ matrix.jar_suffix }}"
          if [ "$name" = "clklog-ui" ]; then
            BUILD_ARGS=(--build-arg HTML_DIR=dist)
          else
            VER="$(cat version.txt)"
            BUILD_ARGS=(--build-arg "JAR_FILE=target/${name}-${VER}${js}.jar")
          fi
          ali_short="${{ matrix.ali }}"
          ali_tag="${ALIYUN_REG}/${ALIYUN_NS_SUFFIX}/${ali_short}:${TAG}"
          ali_latest="${ALIYUN_REG}/${ALIYUN_NS_SUFFIX}/${ali_short}:latest"
          placeholder_tag="ghcr.io/clklog/placeholder-${name}:${TAG}"
          echo "========== build placeholder（验证 COPY JAR/HTML_DIR）${name} =========="
          docker buildx build "${BUILD_ARGS[@]}" \
            --platform "linux/amd64" \
            --output "type=docker" \
            -t "${placeholder_tag}" \
            -f "${df}" .
          if [ "$PUSH_ALI" = "1" ]; then
            echo "========== retag ${name} → Aliyun ACR（2 tags）=========="
            docker tag "${placeholder_tag}" "${ali_tag}"
            docker tag "${placeholder_tag}" "${ali_latest}"
            echo "========== push Aliyun ACR ${ali_tag} + ${ali_latest} =========="
            docker push "${ali_tag}"
            docker push "${ali_latest}"
          else
            echo "${name} ALIYUN ACR PUSH SKIPPED（test_mode 或 Secrets 未配齐）"
          fi

      - name: 清理 Docker Registry 登录态
        if: always()
        run: |
          set +e
          if [ "${{ steps.post_login_aliyun.outputs.login_ok || 'false' }}" = "true" ]; then
            ALIYUN_REG="${ALIYUN_REGISTRY_SECRET:-}"
            if [ -n "$ALIYUN_REG" ]; then
              echo "[aliyun acr] 清理登录态（${ALIYUN_REG}）"
              (docker logout "$ALIYUN_REG" || true)
            fi
          fi
        env:
          ALIYUN_REGISTRY_SECRET: ${{ secrets.ALIYUN_REGISTRY }}

  # ─────────────────────────────────────────────────────────────
  # 4) release：删旧 → 传 3 资产 → 改名/清理 body（非特权，无需审批）
  # ─────────────────────────────────────────────────────────────
  release:
    name: publish-github-release
    needs: [package, docker, setup]
    if: needs.setup.outputs.full_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 计算 SHORT_SHA（7 位，用于匹配打包资源文件名）
        run: |
          set -euo pipefail
          echo "CLKLOG_SHORT_SHA=${GITHUB_SHA:0:7}" >> "${GITHUB_ENV}"

      # 注意：package 上传 release-assets 用的是单目录（path: release-output），artifact 根=该目录本身，
      # 3 个 tar.gz 平铺在 artifact 根；此处解压到 OUTPUT_DIR 子目录，保持下方 files: 的 OUTPUT_DIR/ 前缀成立。
      - name: 下载打包资源产物（3 个 tar · 解压到 OUTPUT_DIR 子目录）
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ github.workspace }}/${{ env.OUTPUT_DIR }}

      # 注意：本 job 无 checkout，workspace 非 git 仓库，gh release view/delete 必须显式 -R 指定仓库，
      # 否则 gh 依赖 git remote 推断会报 "fatal: not a git repository"
      - name: 上传前清空旧 Release（Git tag 保留，不删 tag）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +euo pipefail
          TAG="${CLKLOG_VERSION}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete -y "${TAG}" -R "${GITHUB_REPOSITORY}" --cleanup-tag=never
            DEL_RC=$?
            echo "gh release delete exit_code=${DEL_RC}"
            if [ "${DEL_RC}" -ne 0 ]; then
              REL_ID="$(gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId' 2>/dev/null || true)"
              if [ -n "${REL_ID}" ]; then
                echo "旧 Release 仍存在（databaseId=${REL_ID}），兜底逐个清理用户上传资产"
                OLD_ASSETS="$(gh api "/repos/${OWNER}/${REPO}/releases/${REL_ID}/assets" 2>/dev/null || echo '[]')"
                while IFS=$'\t' read -r OID ONAME; do
                  [ -z "${OID}" ] && continue
                  echo "清理旧资产 id=${OID} name=[${ONAME}]"
                  gh api -X DELETE "/repos/${OWNER}/${REPO}/releases/assets/${OID}" --silent || true
                done < <(echo "${OLD_ASSETS}" | jq -r '.[] | [.id,.name] | @tsv' 2>/dev/null)
              fi
            fi
            sleep 3
          else
            echo "无旧 Release，直接上传"
          fi

      - name: 上传 3 个 Release Assets（源码 / docs / compose）
        id: release_upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CLKLOG_VERSION }}
          generate_release_notes: false
          body: |
            > **资产说明**
            > - 部署请使用 clklog-docker-compose-${{ env.CLKLOG_VERSION }}.tar.gz
            > - 源码请使用 clklog-source-${{ env.CLKLOG_VERSION }}.tar.gz（仅含 clklog/ 源码，已剔除 node_modules/target/dist）
            > - 文档请使用 clklog-docs-${{ env.CLKLOG_VERSION }}.tar.gz
            >
            > 下方由 GitHub 自动生成的 Source code (zip) / Source code (tar.gz) 是 tag 对应的全仓库快照，请勿用于部署；GitHub 不提供删除或关闭它们的选项。

            Full Changelog: ${{ github.server_url }}/${{ github.repository }}/commits/${{ env.CLKLOG_VERSION }}
          files: |
            ${{ env.OUTPUT_DIR }}/clklog-source-${{ env.CLKLOG_VERSION }}_g${{ env.CLKLOG_SHORT_SHA }}.tar.gz
            ${{ env.OUTPUT_DIR }}/clklog-docs-${{ env.CLKLOG_VERSION }}_g${{ env.CLKLOG_SHORT_SHA }}.tar.gz
            ${{ env.OUTPUT_DIR }}/clklog-docker-compose-${{ env.CLKLOG_VERSION }}_g${{ env.CLKLOG_SHORT_SHA }}.tar.gz
          fail_on_unmatched_files: true

      - name: 改名回友好名 + 清理 body 重复（删 _g 后缀；body 只保留 1 条 Full Changelog）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          TAG="${CLKLOG_VERSION}"
          SHA="${CLKLOG_SHORT_SHA}"
          RELEASE_ID="$(gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId')"
          echo "RELEASE_ID(databaseId)=${RELEASE_ID}"
          ASSETS_JSON="$(gh api "/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets")"
          echo "${ASSETS_JSON}" | jq -r '.[] | "  id=\(.id)  name=[\(.name)]"'
          NON_NUM_ID="$(echo "${ASSETS_JSON}" | jq -r '[.[] | select(((.id|type)=="number")|not)] | length')"
          if [ "${NON_NUM_ID}" != "0" ]; then
            echo "::error::REST assets[].id 存在非数字类型（应为纯数字 integer，GraphQL/REST ID 混了），立刻终止避免 PATCH 404。NON_NUM_ID=${NON_NUM_ID}"
            exit 1
          fi
          RENAME=0
          for PAIR in "clklog-source-${TAG}_g${SHA}.tar.gz|clklog-source-${TAG}.tar.gz" \
                      "clklog-docs-${TAG}_g${SHA}.tar.gz|clklog-docs-${TAG}.tar.gz" \
                      "clklog-docker-compose-${TAG}_g${SHA}.tar.gz|clklog-docker-compose-${TAG}.tar.gz"; do
            OLD="${PAIR%%|*}"
            NEW="${PAIR##*|}"
            AID="$(echo "${ASSETS_JSON}" | jq -r --arg n "${OLD}" '.[] | select(.name==$n) | .id')"
            if [ -z "${AID}" ]; then
              echo "::warning::未找到待改名资产 ${OLD}（可能已改名）"
              continue
            fi
            EXISTING_ID="$(echo "${ASSETS_JSON}" | jq -r --arg n "${NEW}" '.[] | select(.name==$n) | .id')"
            if [ -n "${EXISTING_ID}" ] && [ "${EXISTING_ID}" != "${AID}" ]; then
              echo "::warning::目标名 [${NEW}] 被旧资产 id=${EXISTING_ID} 占用，先 DELETE 旧占名再 PATCH 改名（防 422）"
              gh api -X DELETE "/repos/${OWNER}/${REPO}/releases/assets/${EXISTING_ID}" --silent || true
            fi
            echo "改名  id=${AID}  [${OLD}] → [${NEW}]"
            gh api -X PATCH "/repos/${OWNER}/${REPO}/releases/assets/${AID}" -f name="${NEW}" --silent
            RENAME=$((RENAME+1))
          done
          echo "完成：共改名 ${RENAME} 个资产"
          RESCAN_JSON="$(gh api "/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets")"
          echo "${RESCAN_JSON}" | jq -r '.[] | "  id=\(.id)  name=[\(.name)]"'
          CLEAN=0
          while IFS=$'\t' read -r AID ANAME; do
            [ -z "${AID}" ] && continue
            echo "清理残留 id=${AID} name=[${ANAME}]"
            gh api -X DELETE "/repos/${OWNER}/${REPO}/releases/assets/${AID}" --silent || true
            CLEAN=$((CLEAN+1))
          done < <(echo "${RESCAN_JSON}" | jq -r '.[] | select(.name|contains("_g")) | [.id,.name] | @tsv')
          echo "清理完成：删除 ${CLEAN} 个 _g 后缀残留"
          echo "==> 确保 Release body 只有 1 条 Full Changelog（去掉平台自动追加的重复行 / Markdown 反引号包 URL）"
          TARGET="Full Changelog: ${GITHUB_SERVER_URL}/${OWNER}/${REPO}/commits/${TAG}"
          BODY="$(gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json body --jq '.body' || true)"
          echo "当前 body（去重前）："
          printf "%s\n" "${BODY}"
          # 仅对 Full Changelog 行去重，保留资产说明等其余非空行（否则说明会被整段覆盖掉）
          CLEAN_BODY="$(printf "%s\n" "${BODY}" | sed 's/`//g' | awk '/^Full Changelog: / { if (!seen) { print; seen=1 }; next } NF { print }')"
          if [ -z "${CLEAN_BODY}" ]; then
            CLEAN_BODY="${TARGET}"
          elif ! printf "%s\n" "${CLEAN_BODY}" | grep -q '^Full Changelog: '; then
            CLEAN_BODY="${CLEAN_BODY}"$'\n\n'"${TARGET}"
          fi
          echo "清洗后 body："
          printf "%s\n" "${CLEAN_BODY}"
          set +e
          PATCH_OUT="$(gh api -X PATCH "/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}" -f body="${CLEAN_BODY}" 2>&1)"
          PATCH_RC=$?
          set -e
          if [ "${PATCH_RC}" -eq 0 ]; then
            echo "PATCH Release body 完成（exit_code=0）"
          else
            echo "::warning::PATCH Release body 失败 exit_code=${PATCH_RC}，详情：${PATCH_OUT}"
          fi

  # ─────────────────────────────────────────────────────────────
  # 5) Gitee 镜像：把 GitHub Release 的「标题 / 描述 / 打包资源」同步到 Gitee（特权操作，需 release-prod 审批）
  # 依赖仓库 Secrets（缺 GITEE_TOKEN 则本 job 自动跳过，不影响已发布的 GitHub Release）：
  #   GITEE_TOKEN     【必填】Gitee 私人令牌，需 projects(repo) 权限（含 API 调用与 git push）
  #   GITEE_OWNER     【可选，默认 clklog】Gitee 仓库所属空间地址；仅同步到非官方仓库时才需覆盖
  #   GITEE_REPO      【可选，默认 clklog】Gitee 仓库名；仅同步到非官方仓库时才需覆盖
  #                   → 默认即同步至 https://gitee.com/clklog/clklog
  #   GITEE_PUSH_TAG  (可选，默认 true) true = 把 tag 及对应 commit 推到 Gitee（Release 指向正确 commit）
  #                                      false = Release 指向 Gitee 默认分支 HEAD（不推送代码）
  #   GITEE_API       (可选) 企业版可覆盖为 https://<域名>/api/v5
  # 注意：Gitee 单文件附件上限 100MB，超出自动跳过并告警。
  # ─────────────────────────────────────────────────────────────
  sync-gitee:
    name: 同步 GitHub Release → Gitee
    needs: release
    environment: release-prod
    if: >-
      needs.release.result == 'success' &&
      (github.event.inputs.test_mode || 'false') != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # 默认同步至官方 Gitee 仓库 clklog/clklog；如需同步到其它 Gitee 仓库，用 Secret 覆盖即可
      GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'clklog' }}
      GITEE_REPO: ${{ secrets.GITEE_REPO || 'clklog' }}
      GITEE_PUSH_TAG: ${{ secrets.GITEE_PUSH_TAG || 'true' }}
      GITEE_API: ${{ secrets.GITEE_API || 'https://gitee.com/api/v5' }}
      # 顶层 CLKLOG_VERSION 即 github.ref_name；job 级 env 不可用 env 上下文，此处直接用 github 上下文
      TAG: ${{ github.ref_name }}
    steps:
      - name: 判定 Gitee 同步开关（缺 Token 则跳过）
        id: cfg
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 同步（owner/repo 已默认 clklog/clklog）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout（仅 GITEE_PUSH_TAG=true 时需要，用于推送 tag）
        if: steps.cfg.outputs.enabled == 'true' && env.GITEE_PUSH_TAG == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取 GitHub Release 元数据（标题 / 描述 / 资产清单）
        id: meta
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json tagName,name,body,assets \
            --jq '{tag:.tagName, name:.name, body:.body, assets:[.assets[]|{name,url}]}' > /tmp/gh_release.json
          echo "tag=$(jq -r .tag /tmp/gh_release.json)"   >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name /tmp/gh_release.json)" >> "$GITHUB_OUTPUT"
          jq -r .body /tmp/gh_release.json > /tmp/release_body.md
          echo "GitHub Release 资产清单："
          jq -r '.assets[] | "  - \(.name)"' /tmp/gh_release.json

      - name: (可选) 推送 tag 到 Gitee
        if: steps.cfg.outputs.enabled == 'true' && env.GITEE_PUSH_TAG == 'true'
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" 2>/dev/null || true
          git fetch --unshallow || true
          if git push gitee "refs/tags/${TAG}"; then
            echo "已推送 tag ${TAG} 到 Gitee"
          else
            echo "::warning::推送 tag 到 Gitee 失败（可能已存在 / 历史分叉 / 需完整历史），Release 将退化为指向默认分支 HEAD"
          fi
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: 创建 / 复用 Gitee Release（标题 + 描述）
        id: gitee_rel
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TOKEN="$GITEE_TOKEN"; OWNER="$GITEE_OWNER"; REPO="$GITEE_REPO"; API="$GITEE_API"
          TAG="$TAG"; NAME="${{ steps.meta.outputs.name }}"
          BODY="$(cat /tmp/release_body.md)"
          [ -z "$BODY" ] && BODY="Release ${TAG}（由 GitHub Actions 自动同步）"
          # 已存在则复用，避免重复 Release
          HTTP=$(curl -s -o /tmp/exist.json -w "%{http_code}" "${API}/repos/${OWNER}/${REPO}/releases/tags/${TAG}?access_token=${TOKEN}")
          RID=""
          if [ "$HTTP" = "200" ]; then RID=$(jq -r '.id // empty' /tmp/exist.json); fi
          if [ -z "$RID" ]; then
            DEF=$(curl -s "${API}/repos/${OWNER}/${REPO}?access_token=${TOKEN}" | jq -r '.default_branch // "master"')
            PAYLOAD=$(jq -n --arg t "$TOKEN" --arg tag "$TAG" --arg name "$NAME" --arg body "$BODY" --arg tc "$DEF" \
              '{access_token:$t, tag_name:$tag, name:$name, body:$body, target_commitish:$tc, prerelease:false, draft:false}')
            HTTP=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST "${API}/repos/${OWNER}/${REPO}/releases" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              RID=$(jq -r '.id // empty' /tmp/create.json)
            else
              echo "::warning::创建 Gitee Release 返回 HTTP=${HTTP}：$(head -c 300 /tmp/create.json)"
            fi
          fi
          if [ -z "$RID" ]; then echo "::error::无法获取/创建 Gitee Release"; exit 1; fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Gitee Release id=$RID"

      - name: 下载 GitHub 资产并上传到 Gitee（去重 + 100MB 限流）
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$GITEE_TOKEN"; OWNER="$GITEE_OWNER"; REPO="$GITEE_REPO"; API="$GITEE_API"
          RID="${{ steps.gitee_rel.outputs.release_id }}"
          mkdir -p /tmp/gitee_assets
          gh release download "$TAG" -R "${GITHUB_REPOSITORY}" --dir /tmp/gitee_assets --pattern 'clklog-*.tar.gz'
          EXISTING_NAMES=$(curl -s "${API}/repos/${OWNER}/${REPO}/releases/${RID}?access_token=${TOKEN}" | jq -r '[.assets[].name] | join("\n")')
          for f in /tmp/gitee_assets/*; do
            [ -e "$f" ] || continue
            FN="$(basename "$f")"
            if printf '%s\n' "$EXISTING_NAMES" | grep -qx "$FN"; then
              echo "跳过已存在附件：$FN"
              continue
            fi
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 104857600 ]; then
              echo "::warning::$FN 体积 $((SIZE/1024/1024))MB 超过 Gitee 单文件 100MB 上限，跳过"
              continue
            fi
            echo "上传 $FN ..."
            curl -s -X POST "${API}/repos/${OWNER}/${REPO}/releases/${RID}/attach_files" \
              -F "access_token=${TOKEN}" -F "file=@${f}" | jq -r '.id // "upload-no-id"' | sed 's/^/  attach_id=/'
          done
          echo "Gitee 同步完成：https://gitee.com/${OWNER}/${REPO}/releases/${TAG}"
